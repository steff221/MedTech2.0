services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — schema + mock seed mounted as initdb scripts. On a clean
  # volume both run automatically the first time the container starts.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: medtech-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: medtech
      # Use the real superuser — medtech_app is created by 00_create_app_user.sql
      # with DML-only privileges.  This separation means a compromised app
      # credential cannot DROP or ALTER any table.
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Bound to loopback only — the DB is reachable from this host (psql/pgAdmin)
      # but NOT from the network. The app reaches Postgres via the compose
      # network hostname `postgres:5432`, so this does not affect the stack.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initdb scripts run alphabetically on a clean volume:
      #   00_ — create medtech_app login role (DML only)
      #   01_ — create schema owned by the superuser
      #   02_ — mock seed data
      #   03_ — grant DML to medtech_app on all tables created above
      - ./postgres-init/00_create_app_user.sh:/docker-entrypoint-initdb.d/00_create_app_user.sh:ro
      - ../backend/src/main/resources/database/medtech_schema_pg.sql:/docker-entrypoint-initdb.d/01_medtech_schema_pg.sql:ro
      - ./postgres-init/02_grant_app_privileges.sql:/docker-entrypoint-initdb.d/02_grant_app_privileges.sql:ro
    networks:
      - medtech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medtech"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis — in-memory store used for distributed rate limiting.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: medtech-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    networks:
      - medtech-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot. Inside the compose network the DB is at
  # `postgres:5432`, so env vars override the dev defaults from application.yml.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medtech-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -XX:+UseG1GC -XX:MaxRAMPercentage=75.0
      # Override to false when running locally over plain HTTP (nginx without TLS).
      # Remove this line when deploying to a server with HTTPS.
      MEDTECH_SECURITY_COOKIE_SECURE: "false"
    expose:
      - "8080"
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    networks:
      - medtech-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Frontend — Next.js standalone server. NEXT_PUBLIC_API_URL is the URL the
  # *browser* uses to reach the backend, so it's the host's published port,
  # not the compose-internal hostname.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        BACKEND_URL: http://backend:8080
    container_name: medtech-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - medtech-network

  # ---------------------------------------------------------------------------
  # nginx — TLS termination and reverse proxy.
  # Ports 80/443 are the only ones exposed to the host.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: medtech-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/medtech-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - medtech-network

  # ---------------------------------------------------------------------------
  # Certbot — obtains and renews Let's Encrypt TLS certificates.
  # Run manually: docker compose run --rm certbot certonly ...
  # Renewal is handled by: docker compose run --rm certbot renew
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: medtech-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Only runs on demand — no restart policy needed
    profiles:
      - certbot

  # ---------------------------------------------------------------------------
  # pgAdmin — optional DB GUI at http://localhost:5050
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medtech-pgadmin
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'True'
    ports:
      # Loopback only — DB admin GUI must not be exposed to the network.
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medtech-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  medtech-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  certbot_www:
    driver: local
  certbot_certs:
    driver: local
