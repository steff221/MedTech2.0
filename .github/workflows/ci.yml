name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch (saves minutes on noisy pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # LINT — fast feedback before heavier jobs run
  # ============================================================================
  lint:
    name: Lint · frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0

  # ============================================================================
  # CI
  # ============================================================================
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Validate that all Flyway migration SQL files are syntactically consistent
      # and that no two migrations share a version number.
      - name: Validate Flyway migrations
        run: |
          # Check for duplicate version numbers in migration files
          DUPES=$(ls backend/src/main/resources/database/V*.sql 2>/dev/null \
            | sed 's/.*\/V\([0-9]*\)__.*/\1/' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "Duplicate Flyway version(s) found: $DUPES"; exit 1
          fi
          echo "Flyway version check passed ($(ls backend/src/main/resources/database/V*.sql | wc -l | tr -d ' ') migrations)"

      # Tests are pure unit + @WebMvcTest slices (JpaConfig excluded), so no
      # Postgres service is needed. If we add integration tests later, add a
      # `services.postgres` block and SPRING_DATASOURCE_* env vars here.
      # `verify` (not `test`) so the JaCoCo coverage gate in pom.xml runs.
      - name: Run tests + coverage gate
        run: mvn -B verify --no-transfer-progress
        env:
          MEDTECH_SECURITY_JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-only-secret-not-for-production-use' }}

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend · type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api

  # ============================================================================
  # SECURITY — dependency (SCA) + filesystem vulnerability scanning.
  #   Complements Dependabot (.github/dependabot.yml): Dependabot opens PRs to
  #   fix vulns over time; this job *blocks* a build that introduces CRITICAL
  #   ones. Important for a health app handling PII.
  #
  #   Policy: the npm-audit CRITICAL check is the hard gate. HIGH is reported
  #   (visible in logs) but non-blocking — the residual HIGH advisories are all
  #   in Next.js 14.2.x and are either (a) not applicable to this App-Router app
  #   (the Pages-Router middleware-bypass and WebSocket-SSRF advisories), (b) a
  #   dev-only CLI flag we never invoke (glob -c), or (c) DoS-via-Server-
  #   Components issues whose only fix is a breaking Next 15/16 upgrade — tracked
  #   separately as a follow-up. We stay pinned to the latest patched 14.2.x.
  #
  #   Trivy runs as an INFORMATIONAL scan (continue-on-error): its filesystem
  #   scan resolves Maven coordinates over the network and Maven Central
  #   frequently rate-limits CI IPs (HTTP 429), which is a FATAL error unrelated
  #   to our code. We don't let that flakiness block the pipeline; findings are
  #   still printed for review.
  # ============================================================================
  security-scan:
    name: Security · dependency + vuln scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Report HIGH+ advisories for visibility (non-blocking).
      - name: Frontend npm audit (report HIGH+)
        working-directory: frontend
        run: npm audit --audit-level=high || true

      # Hard gate: fail the build only on CRITICAL frontend advisories.
      - name: Frontend npm audit (block CRITICAL)
        working-directory: frontend
        run: npm audit --audit-level=critical

      # Informational filesystem scan run via the official Trivy Docker image
      # directly (NOT the aquasecurity/trivy-action), because that action
      # transitively pins aquasecurity/setup-trivy@v0.2.1, which was yanked from
      # the registry and fails the whole job at "Set up job" before any step
      # runs. A plain `run:` step has no action to pre-resolve. Belt-and-braces
      # non-blocking: continue-on-error AND `|| true`, and we skip the backend
      # Maven scan to avoid Maven Central 429s. npm audit above is the hard gate.
      - name: Trivy scan (informational)
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}":/repo aquasec/trivy:latest \
            fs /repo \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs backend \
            --no-progress \
            --timeout 5m || true

  # ============================================================================
  # Docker build smoke-test — runs on every PR to catch Dockerfile regressions
  # before merge. Does not push; just validates the build succeeds.
  # ============================================================================
  docker-build-check:
    name: Docker build · ${{ matrix.service }}
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # CD — staging auto-deploy on merge to main, production requires manual approval.
  #   Builds + pushes both Docker images to GitHub Container Registry.
  # ============================================================================
  publish:
    name: Publish · ${{ matrix.service }} image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/medtech-${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=MedTech ${{ matrix.service }}
            org.opencontainers.image.description=MedTech 2.0 healthcare platform — ${{ matrix.service }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080/api
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        run: |
          echo "### Published \`${{ matrix.service }}\` image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.img.outputs.name }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # DEPLOY-STAGING — runs automatically after publish succeeds on main.
  #   In a real environment this would SSH into the staging server and run
  #   `docker compose pull && docker compose up -d`. The step is structured
  #   so replacing "echo" with a real deploy command needs one-line change.
  # ============================================================================
  deploy-staging:
    name: Deploy · staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.medtech.mk
    steps:
      - name: Trigger staging deploy
        run: |
          echo "Deploying to staging..."
          echo "Image: ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/medtech-backend:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          # Replace the echo commands below with your actual deploy steps, e.g.:
          # ssh deploy@staging.medtech.mk "cd /opt/medtech && docker compose pull && docker compose up -d"
          echo "Staging deploy complete."

  # ============================================================================
  # DEPLOY-PRODUCTION — requires manual approval via GitHub Environments.
  #   Configure a 'production' environment in Settings > Environments with
  #   required reviewers to enforce the manual gate.
  # ============================================================================
  deploy-production:
    name: Deploy · production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://medtech.mk
    steps:
      - name: Trigger production deploy
        run: |
          echo "Deploying to production (manual approval required via GitHub Environment gate)..."
          echo "Image: ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/medtech-backend:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          # Replace with: ssh deploy@medtech.mk "cd /opt/medtech && docker compose pull && docker compose up -d"
          echo "Production deploy complete."
