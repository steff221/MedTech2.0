spring:
  application:
    name: medtech-backend
  mail:
    host: ${MEDTECH_MAIL_HOST:smtp.gmail.com}
    port: ${MEDTECH_MAIL_PORT:587}
    username: ${MEDTECH_MAIL_USERNAME:noreply@medtech.mk}
    password: ${MEDTECH_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/medtech
    username: medtech_app
    password: ${MEDTECH_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: MedTechHikariPool
  data:
    redis:
      host: ${MEDTECH_REDIS_HOST:localhost}
      port: ${MEDTECH_REDIS_PORT:6379}
      timeout: 2000ms
  flyway:
    locations: classpath:database
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    out-of-order: false
    # Flyway uses the superuser credential so it can execute DDL migrations.
    # The app runtime (HikariCP datasource) uses medtech_app (DML only).
    url: ${MEDTECH_DB_URL:jdbc:postgresql://localhost:5433/medtech}
    user: ${MEDTECH_DB_FLYWAY_USER:postgres}
    password: ${MEDTECH_DB_FLYWAY_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by SQL migrations (medtech_schema_pg.sql); Hibernate must NOT touch DDL.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
  forward-headers-strategy: framework

# Application-specific configuration
medtech:
  security:
    jwt:
      # 32+ byte secret — must be set via MEDTECH_SECURITY_JWT_SECRET env var; no default so startup fails fast if missing
      secret: ${MEDTECH_SECURITY_JWT_SECRET}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
      issuer: medtech-backend
    # Refresh-token cookie Secure flag: false for dev (HTTP), true in prod profile.
    cookie-secure: false
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
      allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed-headers: [Authorization, Content-Type, X-Requested-With, Accept, Origin]
      exposed-headers: [Authorization]
      allow-credentials: true
      max-age-seconds: 3600
  frontend-url: ${MEDTECH_FRONTEND_URL:http://localhost:3000}
  password-reset-ttl-minutes: 30
  appointment:
    default-duration-minutes: 30
    cancellation-window-hours: 24
  pagination:
    default-page-size: 20
    max-page-size: 100

# OpenAPI / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.medtech: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
