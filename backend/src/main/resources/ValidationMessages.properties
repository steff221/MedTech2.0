# Пораки за валидација (Jakarta Bean Validation) на македонски.
# Го заменуваат стандардниот англиски текст што стигнува до корисникот преку
# GlobalExceptionHandler -> ErrorResponse.errors[].message.
#
# Датотеката мора да остане во ISO-8859-1 escape форма или UTF-8 (Java 9+ чита
# .properties како UTF-8), затоа текстот е запишан директно на кирилица.

jakarta.validation.constraints.NotNull.message           = вредноста е задолжителна
jakarta.validation.constraints.NotBlank.message          = вредноста не смее да биде празна
jakarta.validation.constraints.NotEmpty.message          = вредноста не смее да биде празна
jakarta.validation.constraints.Size.message              = должината мора да биде помеѓу {min} и {max}
jakarta.validation.constraints.Min.message               = вредноста мора да биде најмалку {value}
jakarta.validation.constraints.Max.message               = вредноста мора да биде најмногу {value}
jakarta.validation.constraints.DecimalMin.message        = вредноста мора да биде најмалку {value}
jakarta.validation.constraints.DecimalMax.message        = вредноста мора да биде најмногу {value}
jakarta.validation.constraints.Positive.message          = вредноста мора да биде поголема од 0
jakarta.validation.constraints.PositiveOrZero.message    = вредноста мора да биде 0 или поголема
jakarta.validation.constraints.Negative.message          = вредноста мора да биде помала од 0
jakarta.validation.constraints.NegativeOrZero.message    = вредноста мора да биде 0 или помала
jakarta.validation.constraints.Email.message             = неисправна адреса на е-пошта
jakarta.validation.constraints.Pattern.message           = вредноста не е во бараниот формат
jakarta.validation.constraints.Past.message              = датумот мора да биде во минатото
jakarta.validation.constraints.PastOrPresent.message     = датумот не смее да биде во иднина
jakarta.validation.constraints.Future.message            = датумот мора да биде во иднина
jakarta.validation.constraints.FutureOrPresent.message   = датумот не смее да биде во минатото
jakarta.validation.constraints.Digits.message            = вредноста мора да има највеќе {integer} цели и {fraction} децимални цифри
jakarta.validation.constraints.AssertTrue.message        = вредноста мора да биде точна
jakarta.validation.constraints.AssertFalse.message       = вредноста мора да биде неточна
